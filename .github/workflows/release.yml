name: CI Pipeline
on:
  push:
    branches:
      - stable
  pull_request:
    branches:
      - stable
      
jobs:
  server-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org/
      - run: echo "Start"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
